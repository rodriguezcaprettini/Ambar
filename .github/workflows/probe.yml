name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pdfplumber requests
      - run: |
          python - <<'PY'
          import requests,pdfplumber,io,re
          r=requests.get("https://cdn.bancentral.gov.do/documents/estadisticas/mercado-cambiario/documents/SONDEO_VENTANILLA_DOLAR.pdf",headers={"User-Agent":"Mozilla/5.0"})
          t="\n".join(p.extract_text() or "" for p in pdfplumber.open(io.BytesIO(r.content)).pages)
          print(re.findall(r"^(\d{2})/(\d{2})/(\d{2}) ([\d.]+) - ([\d.]+) -$", t, re.M))
          print([l for l in t.splitlines() if re.match(r"^\d{2}/",l)])
          PY
