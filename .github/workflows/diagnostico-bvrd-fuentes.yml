name: Diagnostico fuentes BVRD
on:
  workflow_dispatch:
  push:
    branches: [investigar-bvrd-cdn]
    paths:
      - "scripts/diagnostico_bvrd_fuentes.py"
      - ".github/workflows/diagnostico-bvrd-fuentes.yml"
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia
        run: python -m pip install requests
      - name: Consultar fuentes públicas y enlaces Excel
        run: python scripts/diagnostico_bvrd_fuentes.py
