name: Respaldo completo (Supabase)
on:
  schedule:
    - cron: "17 9 * * 0"   # domingos 5:17 am hora RD
  workflow_dispatch:
concurrency: respaldo
jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Respaldar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/respaldo.py
