# Archivo histórico de noticias económicas (todo lo que permita cada medio), por tandas de madrugada.
# Escribe directo en la tabla public.noticias de Supabase, así que no frena al robot de cada 30 minutos.
# Cada noche procesa hasta 25,000 notas; cuando ya no quedan pendientes, la corrida termina en pocos minutos.
name: Archivo de noticias (madrugada)
on:
  schedule:
    - cron: "0 7 * * *"   # 3:00 am hora RD, todos los días
  workflow_dispatch:
    inputs:
      maximo:
        description: "Notas a procesar en esta tanda"
        default: "25000"
permissions:
  contents: read
concurrency: archivo-noticias
jobs:
  archivo:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: mkdir -p data && python scripts/supa.py bajar-estado
      - run: python scripts/noticias.py --archivo ${{ inputs.maximo || '25000' }}
