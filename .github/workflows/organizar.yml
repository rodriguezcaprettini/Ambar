name: Organizar archivos (una sola vez)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p scripts data
          git mv boletin.py noticias.py build_data.py scripts/
          git mv data.js emisiones.csv emisiones_fecha.txt noticias.json operaciones.csv precios.csv data/
          git config user.name "ambar-bot"
          git config user.email "ambar-bot@users.noreply.github.com"
          git commit -m "Organizar archivos en scripts/ y data/"
          git push
