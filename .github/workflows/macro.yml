# Robot MACRO: precios e inflación (IPC) y publicaciones del Banco Central.
# Cada 15 minutos, todos los días. Solo se sube si cambió algo.
name: Macro (Banco Central)
on:
  schedule:
    - cron: "52 */3 * * *"   # respaldo: el horario principal (cada 15 min) lo lanza Supabase (pg_cron)
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: macro
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl xlrd
      - name: Descargar y preparar datos macro
        run: python scripts/macro.py
      - name: Publicaciones del Banco Central (informes periódicos y anuales)
        continue-on-error: true
        run: python scripts/bcpub.py
      - name: Registrar publicaciones nuevas
        continue-on-error: true
        run: python scripts/publicar.py
