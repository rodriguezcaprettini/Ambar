# Robot diario de Ámbar: descarga el boletín de la BVRD y las noticias, y actualiza la terminal.
name: Actualización diaria
on:
  schedule:
    - cron: "15 12 * * 1-5"   # 8:15 am hora RD (las noticias ahora tienen su propio robot cada 30 min)
    - cron: "3,18,33,48 17-23 * * 1-5" # cada 15 min de 1:00 pm a 7:45 pm hora RD: busca el boletín del día (se marca PRELIMINAR)
    - cron: "3,18,33,48 0 * * 2-6"     # cada 15 min de 8:00 pm a 8:45 pm hora RD
    - cron: "5 1 * * 2-6"     # 9:05 pm hora RD: descarga definitiva del boletín del día
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano
permissions:
  contents: read            # el robot ya no escribe en el repositorio: los datos viven en Supabase
concurrency: datos            # evita que dos robots escriban a la vez
jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl beautifulsoup4
      - name: Traer estado desde Supabase
        run: python scripts/supa.py bajar-estado
      - name: Boletín BVRD del día (servidor)
        run: python scripts/boletin.py
      - name: ¿Ya aparece en la página web de la BVRD?
        continue-on-error: true   # si la página falla, el resto del robot sigue
        run: |
          python scripts/calendario.py || {
            [ $? -eq 3 ] || exit 1
            echo "La lista JSON falló: se usa el navegador de respaldo"
            pip install playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
            python scripts/calendario.py --navegador
          }
      - name: Noticias
        run: python scripts/noticias.py
      - name: Preparar datos de la terminal
        run: python scripts/build_data.py
      - name: Subir a Supabase (almacenamiento privado)
        run: python scripts/supa.py subir
      - name: Registrar publicaciones nuevas
        continue-on-error: true
        run: python scripts/publicar.py
