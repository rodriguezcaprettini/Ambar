# Robot diario de Ámbar: descarga el boletín de la BVRD y las noticias, y actualiza la terminal.
name: Actualización diaria
on:
  schedule:
    - cron: "15 12 * * 1-5"   # 8:15 am hora RD: noticias de la mañana
    - cron: "0 22 * * 1-5"    # 6:00 pm hora RD: boletín del día + noticias
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano
permissions:
  contents: write
concurrency: datos            # evita que dos robots escriban a la vez
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl beautifulsoup4
      - name: Boletín BVRD del día
        run: python scripts/boletin.py
      - name: Noticias
        run: python scripts/noticias.py
      - name: Preparar datos de la terminal
        run: python scripts/build_data.py
      - name: Guardar cambios
        run: |
          git config user.name "ambar-bot"
          git config user.email "ambar-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos $(date -u +%F)" || echo "Sin cambios"
          git push
