# Robot de noticias de Ámbar: revisa titulares nuevos cada 30 minutos, todos los días.
# GitHub puede retrasar unos minutos las corridas programadas cuando sus servidores están cargados.
name: Noticias cada 30 minutos
on:
  schedule:
    - cron: "7,37 * * * *"   # minuto 7 y 37 de cada hora (evita el minuto 0, que GitHub suele retrasar)
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: datos            # espera si otro robot está escribiendo los datos
jobs:
  noticias:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl beautifulsoup4
      - name: Traer estado desde Supabase
        run: python scripts/supa.py bajar-estado
      - name: Titulares nuevos
        run: python scripts/noticias.py
      - name: Preparar datos de la terminal
        run: python scripts/build_data.py
      - name: Subir a Supabase (almacenamiento privado)
        run: python scripts/supa.py subir
