# Carga histórica: descarga todos los boletines entre dos fechas. Se corre a mano, una vez.
name: Cargar historial
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD)"
        required: true
        default: "2026-01-02"
      hasta:
        description: "Fecha final (AAAA-MM-DD)"
        required: true
        default: "2026-11-05"
permissions:
  contents: read
concurrency: datos
jobs:
  historial:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl
      - name: Traer estado desde Supabase
        run: python scripts/supa.py bajar-estado
      - name: Descargar boletines
        run: python scripts/boletin.py ${{ inputs.desde }} ${{ inputs.hasta }}
      - name: Preparar datos de la terminal
        run: python scripts/build_data.py
      - name: Subir a Supabase (almacenamiento privado)
        run: python scripts/supa.py subir
