# Carga histórica: descarga todos los boletines entre dos fechas. Se corre a mano, una vez.
name: Cargar historial
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD)"
        required: true
        default: "2026-01-02"
      hasta:
        description: "Fecha final (AAAA-MM-DD)"
        required: true
        default: "2026-11-05"
      modo:
        description: "todo = secundario y primario · primario = solo recargar mercado primario y volumen por puesto · noticias = archivo de titulares desde 2025"
        required: true
        default: "todo"
        type: choice
        options: [todo, primario, noticias]
permissions:
  contents: read
concurrency: datos
jobs:
  historial:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl beautifulsoup4
      - name: Traer estado desde Supabase
        run: python scripts/supa.py bajar-estado
      - name: Descargar boletines
        run: |
          if [ "${{ inputs.modo }}" = "noticias" ]; then
            python scripts/noticias.py --historial
          elif [ "${{ inputs.modo }}" = "primario" ]; then
            python scripts/boletin.py --primario ${{ inputs.desde }} ${{ inputs.hasta }}
          else
            python scripts/boletin.py ${{ inputs.desde }} ${{ inputs.hasta }}
          fi
      - name: Preparar datos de la terminal
        run: python scripts/build_data.py
      - name: Subir a Supabase (almacenamiento privado)
        run: python scripts/supa.py subir
