# Robot de divisas: datos del Banco Central (mercado cambiario).
# Lunes a viernes, cada 15 min de 8:00 AM a 12:00 AM hora RD (UTC-4); sábados de 8:00 AM a 7:00 PM.
name: Divisas (Banco Central)
on:
  schedule:   # respaldo: el horario principal (cada 15 min) lo lanza Supabase (pg_cron) a la hora exacta
    - cron: "33 13-23/2 * * 1-5"
    - cron: "33 1,3 * * 2-6"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: divisas
jobs:
  divisas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl xlrd pdfplumber
      - name: Descargar y preparar divisas
        run: python scripts/divisas.py
      - name: Registrar publicaciones nuevas
        continue-on-error: true
        run: python scripts/publicar.py
