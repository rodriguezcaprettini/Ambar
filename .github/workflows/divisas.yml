# Robot de divisas: datos del Banco Central (mercado cambiario).
# Lunes a viernes, cada 15 min de 8:00 AM a 12:00 AM hora RD (UTC-4); sábados de 8:00 AM a 7:00 PM.
name: Divisas (Banco Central)
on:
  schedule:
    - cron: "11,26,41,56 12-23 * * 1-5"   # 8:11 AM – 7:56 PM RD
    - cron: "11,26,41,56 0-3 * * 2-6"     # 8:11 PM – 11:56 PM RD (ya es el día siguiente en UTC)
    - cron: "11,26,41,56 12-22 * * 6"     # sábados 8:11 AM – 6:56 PM RD: recoge lo del viernes que el Banco Central publica tarde
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: divisas
jobs:
  divisas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pandas openpyxl xlrd pdfplumber
      - name: Descargar y preparar divisas
        run: python scripts/divisas.py
      - name: Registrar publicaciones nuevas
        continue-on-error: true
        run: python scripts/publicar.py
